<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- OG Social Card — 1200x630 — MLOps.dev by Raghunathareddy GR -->
  <rect width="1200" height="630" fill="#03050A"/>
  <!-- Grid overlay -->
  <defs>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M 52 0 L 0 0 0 52" fill="none" stroke="#4F7FEF" stroke-width=".4" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Gradient glow bg -->
  <ellipse cx="300" cy="315" rx="500" ry="400" fill="#4F7FEF" opacity=".06"/>
  <ellipse cx="950" cy="400" rx="350" ry="300" fill="#00E5A0" opacity=".04"/>
  <!-- Logo mark — left -->
  <g transform="translate(80,220)">
    <polygon points="90,0 0,45 0,135 90,180 180,135 180,45" fill="none" stroke="#4F7FEF" stroke-width="3" stroke-linejoin="round"/>
    <line x1="90" y1="0" x2="90" y2="180" stroke="#4F7FEF" stroke-width="1.2" opacity=".25"/>
    <line x1="0" y1="45" x2="180" y2="135" stroke="#4F7FEF" stroke-width="1.2" opacity=".25"/>
    <line x1="180" y1="45" x2="0" y2="135" stroke="#4F7FEF" stroke-width="1.2" opacity=".25"/>
    <polygon points="90,36 36,63 36,117 90,144 144,117 144,63" fill="none" stroke="#4F7FEF" stroke-width="1" stroke-linejoin="round" opacity=".3"/>
    <circle cx="90" cy="0" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="0" cy="45" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="0" cy="135" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="90" cy="180" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="180" cy="135" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="180" cy="45" r="5" fill="#4F7FEF" opacity=".5"/>
    <circle cx="90" cy="90" r="22" fill="none" stroke="#00E5A0" stroke-width="1.5" opacity=".25"/>
    <circle cx="90" cy="90" r="13" fill="#00E5A0"/>
    <circle cx="90" cy="90" r="8" fill="#03050A"/>
    <circle cx="90" cy="90" r="4" fill="#00E5A0"/>
  </g>
  <!-- Wordmark -->
  <text x="320" y="295" font-family="'Inter',sans-serif" font-size="82" font-weight="700" fill="#CDD6F0" letter-spacing="-3">MLOps</text>
  <text x="320" y="295" font-family="'Inter',sans-serif" font-size="82" font-weight="700" fill="#CDD6F0" letter-spacing="-3">
    <tspan fill="#CDD6F0">MLOps</tspan><tspan fill="#4F7FEF" font-family="'Courier New',monospace">.dev</tspan>
  </text>
  <!-- Tagline -->
  <text x="322" y="350" font-family="'Inter',sans-serif" font-size="28" font-weight="300" fill="#5A6A8A" letter-spacing="0">Deploy ML models to edge devices at scale.</text>
  <!-- Divider -->
  <line x1="320" y1="390" x2="1100" y2="390" stroke="#4F7FEF" stroke-width=".5" opacity=".2"/>
  <!-- Stats row -->
  <text x="322" y="440" font-family="'Courier New',monospace" font-size="20" fill="#4F7FEF">&lt;8MB</text>
  <text x="322" y="465" font-family="'Inter',sans-serif" font-size="15" font-weight="300" fill="#2A3450">agent binary</text>
  <text x="500" y="440" font-family="'Courier New',monospace" font-size="20" fill="#4F7FEF">99.7%</text>
  <text x="500" y="465" font-family="'Inter',sans-serif" font-size="15" font-weight="300" fill="#2A3450">sync uptime</text>
  <text x="700" y="440" font-family="'Courier New',monospace" font-size="20" fill="#4F7FEF">&lt;90s</text>
  <text x="700" y="465" font-family="'Inter',sans-serif" font-size="15" font-weight="300" fill="#2A3450">deploy latency</text>
  <text x="870" y="440" font-family="'Courier New',monospace" font-size="20" fill="#00E5A0">● LIVE</text>
  <text x="870" y="465" font-family="'Inter',sans-serif" font-size="15" font-weight="300" fill="#2A3450">fleet status</text>
  <!-- Domain -->
  <text x="322" y="560" font-family="'Courier New',monospace" font-size="18" fill="#2A3450">www.mlops.dev · hello@mlops.dev</text>
</svg>
