name: Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f frontend/requirements.txt ]; then pip install -r frontend/requirements.txt; fi
        pip install pytest flake8 responses requests
        if [ -d "sdk" ]; then pip install -e ./sdk; fi
        
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Start API Server for E2E Tests
      run: |
        python frontend/api/index.py &
        for i in {1..20}; do
          if curl -s http://127.0.0.1:8000/v1/health > /dev/null 2>&1; then
            echo "API server is ready"
            break
          fi
          echo "Waiting for API server..."
          sleep 1
        done
        
    - name: Run test suite with pytest
      run: |
        pytest
