name: Deploy to Render

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend/api/**'
      - 'requirements.txt'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest

    steps:
    - name: Trigger deploy
      run: |
        if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
          curl -sS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        else
          echo "RENDER_DEPLOY_HOOK secret is not configured. Skipping deploy hook."
        fi
