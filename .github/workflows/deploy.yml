name: Deploy to Render

on:
  push:
    branches: [ "main" ]
    paths:
      - 'frontend/api/**'
      - 'requirements.txt'
      - 'render.yaml'

jobs:
  deploy:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest

    steps:
    - name: Trigger deploy
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
