services:
  - type: web
    name: mlops-dev-server
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn -k gevent -b 0.0.0.0:$PORT app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://www.mlopsde.me"

databases:
  - name: mlops-db
    region: ohio
    plan: free
    databaseName: mlops
    user: mlops
