services:
  - type: web
    name: mlops-api
    env: python
    region: ohio
    plan: starter
    buildCommand: "pip install -r sdk/server/requirements.txt"
    startCommand: "cd sdk/server && gunicorn -b 0.0.0.0:$PORT api:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: mlops-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: "https://www.mlopsde.me"

databases:
  - name: mlops-db
    region: ohio
    plan: starter
    databaseName: mlops
    user: mlops
